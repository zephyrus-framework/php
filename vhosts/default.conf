<VirtualHost *:${APACHE_PORT}>
    # Keep an encoded slash (%2F) in a path and hand it to PHP instead of answering Apache's own 404. Not inherited
    # from the server config: every <VirtualHost> needs its own line.
    AllowEncodedSlashes NoDecode

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # A .htaccess is read in public/ alone, never in the application root above it.
    <Directory /var/www/>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/public>
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
