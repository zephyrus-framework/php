name: Build

on:
  workflow_call:
    inputs:
      publish:
        description: "Push the images, the registry cache and the multi-arch tags"
        required: true
        type: boolean
      fresh:
        description: "Build without the layer cache, so every apt step runs again"
        required: false
        type: boolean
        default: false

jobs:
  version:
    name: PHP ${{ matrix.php.version }}
    strategy:
      # A failing version never stops nor holds back another one.
      fail-fast: false
      matrix:
        # The one place the references of each PHP version are set.
        php:
          - version: "8.4"
            apcu: 819fce90c469a5666b1706036cd66120af419f1f # v5.1.28
            ssh2: ec4818971a469893dc68906dbd0e36b2915e846f # 1.3.1
            xdebug: 127bbcb980400752221cfaa54bdc1420e6ef3c12 # 3.5.3
          - version: "8.6"
            apcu: fb2c942552a3f5dab7f4dea4afb5cf0831222c57 # no release builds on 8.6 yet
            ssh2: e5d1333605d58805ea317f4349458201786dd1ca # 1.6.1: 1.3.1 does not build with GCC 14
            xdebug: 85f513aca01e2edb9b854b6c1bb0f550e62f887b # 3.6.0alpha2-dev
    uses: ./.github/workflows/version.yml
    with:
      version: ${{ matrix.php.version }}
      apcu: ${{ matrix.php.apcu }}
      ssh2: ${{ matrix.php.ssh2 }}
      xdebug: ${{ matrix.php.xdebug }}
      publish: ${{ inputs.publish }}
      fresh: ${{ inputs.fresh }}
